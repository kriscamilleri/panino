name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Only tracked drift can block `git pull`. The server legitimately carries
      # untracked operational files (env backups, backups/, generated nginx.conf),
      # so --untracked-files=no keeps the gate meaningful instead of always-red.
      - name: Check server checkout is clean
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "cd \"$PROJECT_PATH\" && git status --porcelain --untracked-files=no" > /tmp/dirty.txt
          if [ -s /tmp/dirty.txt ]; then
            echo "::error::Server checkout has tracked drift; deploy would fail on git pull:"
            cat /tmp/dirty.txt
            exit 1
          fi

      - name: Deploy to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "cd \"$PROJECT_PATH\" && git pull origin main && sudo ./deploy.sh"
